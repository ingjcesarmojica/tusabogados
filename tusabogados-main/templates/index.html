<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claudia García - Agente Especializada en Derecho</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #03203f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
        }
        
        .app-container {
            width: 380px;
            height: 700px;
            background: #03203f;
            border: 1px solid #185FA5;
            border-radius: 30px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
        }
        
        .header {
            text-align: center;
            padding: 20px 20px 10px;
            flex-shrink: 0;
        }
        
        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }
        
        .scales-icon {
            width: 24px;
            height: 24px;
            margin-right: 8px;
        }
        
        .logo-text {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
        }
        
        .profile-section {
            text-align: center;
            position: relative;
        }
        
        .avatar-container {
            width: 80px;
            height: 80px;
            margin: 0 auto 10px;
            position: relative;
        }
        
        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid #85B7EB;
            background: #e2e8f0 url('https://bidamericas.com/tusabogados/foto.png') center/cover;
            position: relative;
            z-index: 2;
        }
        
        .online-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #25d366;
            color: #ffffff;
            font-size: 9px;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 8px;
            white-space: nowrap;
            z-index: 3;
            border: 2px solid #03203f;
            animation: pulseBadge 2s ease-in-out infinite;
        }
        
        @keyframes pulseBadge {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .pulse-rings {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 120px;
            z-index: 1;
            opacity: 1;
        }
        
        .pulse-rings.active {
            opacity: 1;
        }
        
        .pulse-ring {
            position: absolute;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            width: 100%;
            height: 100%;
            animation: pulse 2s ease-out infinite;
        }
        
        .pulse-ring:nth-child(2) { animation-delay: 0.3s; }
        .pulse-ring:nth-child(3) { animation-delay: 0.6s; }
        
        @keyframes pulse {
            0% { transform: scale(0.75); opacity: 0.8; }
            100% { transform: scale(1.2); opacity: 0; }
        }
        
        .profile-name {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 2px;
        }
        
        .profile-title {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 500;
        }
        
        .mode-toggle {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 10px 20px;
            flex-shrink: 0;
        }
        
        .mode-btn {
            padding: 8px 20px;
            border-radius: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: transparent;
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }
        
        .mode-btn.active {
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.5);
        }
        
        .mode-btn:hover {
            background: rgba(23, 43, 74, 0.6);
        }
        
        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
        }
        
        .chat-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
            padding: 0;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 0;
        }
        
        .chat-messages::-webkit-scrollbar {
            width: 4px;
        }
        
        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
        }
        
        .message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 13px;
            line-height: 1.4;
            word-wrap: break-word;
        }
        
        .message.bot {
            align-self: flex-start;
            background: #0a2f57;
            color: #ffffff;
            border-bottom-left-radius: 4px;
        }
        
        .message.bot.error {
            background: #e8760a;
            color: #000000;
            border: 1px solid #f5a623;
        }
        
        .message.user {
            align-self: flex-end;
            background: #25d366;
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }
        
        .message.typing {
            background: #0a2f57;
        }
        
        .typing-dots {
            display: flex;
            gap: 4px;
            padding: 4px 0;
        }
        
        .typing-dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.6);
            animation: typingBounce 1.4s infinite ease-in-out both;
        }
        
        .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
        .typing-dots span:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes typingBounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        
        .chat-input-area {
            padding: 10px 15px 15px;
            display: flex;
            gap: 8px;
            background: #0a2f57;
            flex-shrink: 0;
        }
        
        .chat-input {
            flex: 1;
            padding: 10px 15px;
            border-radius: 20px;
            border: none;
            background: #0c447c;
            color: #ffffff;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            outline: none;
        }
        
        .chat-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        
        .chat-input:focus {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .send-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: #25d366;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        
        .send-btn:hover {
            background: #128c7e;
            transform: scale(1.05);
        }
        
        .send-btn:disabled {
            background: rgba(255, 255, 255, 0.2);
            cursor: not-allowed;
            transform: none;
        }
        
        .send-btn svg {
            width: 18px;
            height: 18px;
        }
        
        .status-indicator {
            text-align: center;
            padding: 8px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.7);
            flex-shrink: 0;
        }
        
        .error-message {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            background: rgba(239, 68, 68, 0.9);
            color: #ffffff;
            padding: 8px;
            border-radius: 8px;
            font-size: 11px;
            text-align: center;
            display: none;
            z-index: 10;
        }
        
        .speak-btn {
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            transition: all 0.2s ease;
        }
        
        .speak-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        .speak-btn.playing {
            background: #25d366;
        }
        
        .sound-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
        }

        .sound-toggle-text {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
            user-select: none;
        }

        .toggle-switch {
            position: relative;
            width: 40px;
            height: 22px;
            cursor: pointer;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            inset: 0;
            background: #555;
            border-radius: 22px;
            transition: background 0.3s ease;
        }

        .toggle-slider::before {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            left: 3px;
            top: 3px;
            background: #fff;
            border-radius: 50%;
            transition: transform 0.3s ease;
        }

        .toggle-switch input:checked + .toggle-slider {
            background: #25d366;
        }

        .toggle-switch input:checked + .toggle-slider::before {
            transform: translateX(18px);
        }
        
        .buttons-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 8px 0;
            justify-content: center;
            width: 100%;
        }
        
        .option-btn {
            padding: 10px 18px;
            border-radius: 20px;
            border: 2px solid #f5c518;
            background: #f5c518;
            color: #000000;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            text-align: center;
            min-width: 120px;
        }
        
        .option-btn:hover {
            background: #e0b415;
            color: #000000;
            transform: scale(1.03);
            border-color: #e0b415;
        }
        
        .option-btn:active {
            transform: scale(0.98);
        }
        
        .option-btn.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }
        
        .option-btn-small {
            padding: 8px 14px;
            font-size: 12px;
            min-width: 100px;
        }
        
        @media (max-width: 420px) {
            .app-container {
                width: 100%;
                height: 100vh;
                border-radius: 0;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="error-message" id="errorMessage"></div>
        
        <div class="header">
            <div class="logo-container">
                <svg class="scales-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2L13.09 8.26L22 9L13.09 9.74L12 16L10.91 9.74L2 9L10.91 8.26L12 2M8 11.5L6.5 16.5L11.5 17.2L13 12.2L8 11.5M16 11.5L13 12.2L14.5 17.2L19.5 16.5L18 11.5L16 11.5Z"/>
                </svg>
                <div class="logo-text">tusabogados.com</div>
            </div>
            
            <div class="profile-section">
                <div class="online-badge">En línea</div>
                <div class="avatar-container">
                    <div class="avatar"></div>
                    <div class="pulse-rings" id="pulseRings">
                        <div class="pulse-ring"></div>
                        <div class="pulse-ring"></div>
                        <div class="pulse-ring"></div>
                    </div>
                </div>
                
                <div class="profile-name">Claudia García</div>
                <div class="profile-title">Agente Especializada en Derecho</div>
                <div class="sound-toggle">
                    <span class="sound-toggle-text">Sonido</span>
                    <label class="toggle-switch">
                        <input type="checkbox" id="soundCheckbox" checked onchange="toggleSound()">
                        <span class="toggle-slider"></span>
                    </label>
                </div>
            </div>
        </div>
        
        <div class="mode-toggle" style="display:none;">
            <button class="mode-btn active" id="chatModeBtn" onclick="switchMode('chat')">Chat</button>
        </div>
        
        <div class="content-area">
            <div class="chat-view active" id="chatView">
                <div class="chat-messages" id="chatMessages">
                </div>
                <div class="chat-input-area">
                    <input type="file" id="chatFileInput" multiple accept="image/*,.pdf,.doc,.docx,.mp3,.wav,.ogg" style="display:none" onchange="handleChatFileSelect(event)">
                    <button class="send-btn" id="chatUploadBtn" onclick="document.getElementById('chatFileInput').click()" style="display:none" title="Adjuntar archivo">
                        <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
                            <path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/>
                        </svg>
                    </button>
                    <input type="text" class="chat-input" id="chatInput" placeholder="Escribe tu mensaje..." onkeypress="handleKeyPress(event)">
                    <button class="send-btn" id="sendBtn" onclick="sendChatText()">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                        </svg>
                    </button>
                </div>
                <div id="chatUploadPreview" style="display:none; padding:8px 12px; background:#1a1a2e; border-top:1px solid #333; font-size:12px; color:#ccc;"></div>
            </div>
            

        </div>
        
        <div class="status-indicator" id="statusIndicator">Este sitio implementa Inteligencia Artificial</div>
    </div>

    <script>
        let currentMode = 'chat';
        let isSpeaking = false;
        let currentAudio = null;
        let chatHistory = [];
        let soundEnabled = true;
        
        const CHAT_API_URL = '/api/chat';
        const SPEAK_API_URL = '/api/speak';
        
        function toggleSound() {
            soundEnabled = document.getElementById('soundCheckbox').checked;
            if (!soundEnabled) {
                stopCurrentAudio();
            }
        }
        
        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendChatText();
            }
        }
        
        function sendChatText() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            addMessage(message, 'user');
            input.value = '';
            
            document.getElementById('sendBtn').disabled = true;
            showTyping();
            
            fetch(CHAT_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: message })
            })
            .then(response => response.json())
            .then(data => {
                setTimeout(function() {
                    hideTyping();
                    document.getElementById('sendBtn').disabled = false;
                    
                    if (data.error) {
                        addMessage('Lo siento, hubo un error. Intenta de nuevo.', 'bot');
                        return;
                    }
                    
                    addMessage(data.response, 'bot', data.buttons);
                    toggleUploadBtn(data.show_upload);
                }, 3000);
            })
            .catch(error => {
                hideTyping();
                document.getElementById('sendBtn').disabled = false;
                addMessage('Error de conexión. Verifica tu internet.', 'bot');
            });
        }
        
        function sendButtonAction(action, texto) {
            addMessage(texto, 'user');
            
            showTyping();
            
            fetch(CHAT_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: texto, action: action })
            })
            .then(response => response.json())
            .then(data => {
                setTimeout(function() {
                    hideTyping();
                    
                    if (data.error) {
                        addMessage('Lo siento, hubo un error. Intenta de nuevo.', 'bot');
                        return;
                    }
                    
                    addMessage(data.response, 'bot', data.buttons);
                    toggleUploadBtn(data.show_upload);
                }, 3000);
            })
            .catch(error => {
                hideTyping();
                addMessage('Error de conexión. Verifica tu internet.', 'bot');
            });
        }
        
        function toggleUploadBtn(show) {
            var btn = document.getElementById('chatUploadBtn');
            if (btn) btn.style.display = show ? 'inline-flex' : 'none';
        }
        
        var chatSelectedFiles = [];
        
        function handleChatFileSelect(event) {
            var files = Array.from(event.target.files);
            chatSelectedFiles = chatSelectedFiles.concat(files);
            renderUploadPreview();
        }
        
        function renderUploadPreview() {
            var preview = document.getElementById('chatUploadPreview');
            
            if (!chatSelectedFiles || chatSelectedFiles.length === 0) {
                preview.style.display = 'none';
                return;
            }
            
            preview.style.display = 'block';
            var html = '<div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;">';
            chatSelectedFiles.forEach(function(f, i) {
                var icon = '📄';
                if (f.type && f.type.startsWith('image/')) icon = '🖼️';
                else if (f.type && f.type.startsWith('audio/')) icon = '🎵';
                html += '<span style="background:#2a2a4a;padding:4px 8px;border-radius:6px;font-size:11px;">' + icon + ' ' + f.name + ' <span style="cursor:pointer;color:#e8760a;" onclick="removeFile(' + i + ')">✕</span></span>';
            });
            html += '</div>';
            preview.innerHTML = html;
        }
        
        function removeFile(index) {
            chatSelectedFiles.splice(index, 1);
            renderUploadPreview();
        }
        
        function addMessage(text, sender, buttons = null) {
            const container = document.getElementById('chatMessages');
            const msg = document.createElement('div');
            const isError = sender === 'bot' && text.startsWith('Por favor, verifica');
            msg.className = isError ? 'message bot error' : `message ${sender}`;
            
            const textSpan = document.createElement('span');
            textSpan.textContent = text;
            msg.appendChild(textSpan);
            
            container.appendChild(msg);
            
            if (sender === 'bot' && soundEnabled) {
                speakMessage(text);
            }
            
            if (buttons && buttons.length > 0 && sender === 'bot') {
                const buttonsDiv = document.createElement('div');
                buttonsDiv.className = 'buttons-container';
                
                buttons.forEach(btn => {
                    const optionBtn = document.createElement('button');
                    optionBtn.className = 'option-btn';
                    optionBtn.textContent = btn.texto;
                    optionBtn.title = btn.descripcion || '';
                    optionBtn.onclick = function() {
                        sendButtonAction(btn.valor, btn.texto);
                        disableButtons(buttonsDiv);
                    };
                    buttonsDiv.appendChild(optionBtn);
                });
                
                container.appendChild(buttonsDiv);
            }
            
            container.scrollTop = container.scrollHeight;
        }
        
        function disableButtons(container) {
            const buttons = container.querySelectorAll('.option-btn');
            buttons.forEach(btn => {
                btn.classList.add('disabled');
            });
        }
        
        function showTyping() {
            const container = document.getElementById('chatMessages');
            const typing = document.createElement('div');
            typing.className = 'message bot typing';
            typing.id = 'typingIndicator';
            typing.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
            container.appendChild(typing);
            container.scrollTop = container.scrollHeight;
            document.getElementById('pulseRings').classList.add('active');
        }
        
        function hideTyping() {
            const typing = document.getElementById('typingIndicator');
            if (typing) typing.remove();
            document.getElementById('pulseRings').classList.remove('active');
        }
        
        function stopCurrentAudio() {
            if (currentAudio) {
                try {
                    currentAudio.pause();
                    currentAudio.currentTime = 0;
                } catch(e) {}
                currentAudio = null;
            }
            isSpeaking = false;
            document.querySelectorAll('.speak-btn').forEach(b => b.classList.remove('playing'));
        }
        
        function speakMessage(text, btn) {
            stopCurrentAudio();
            
            if (!soundEnabled) return;
            
            if (btn && btn.classList.contains('playing')) return;
            
            if (btn) btn.classList.add('playing');
            isSpeaking = true;
            
            fetch(SPEAK_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            })
            .then(response => response.json())
            .then(data => {
                if (!isSpeaking || !soundEnabled) return;
                
                if (data.audioUrl) {
                    currentAudio = new Audio(data.audioUrl);
                    currentAudio.onended = function() {
                        isSpeaking = false;
                        currentAudio = null;
                        if (btn) btn.classList.remove('playing');
                    };
                    currentAudio.onerror = function() {
                        isSpeaking = false;
                        currentAudio = null;
                        if (btn) btn.classList.remove('playing');
                    };
                    currentAudio.play().catch(() => {
                        isSpeaking = false;
                        if (btn) btn.classList.remove('playing');
                    });
                } else {
                    isSpeaking = false;
                    if (btn) btn.classList.remove('playing');
                }
            })
            .catch(() => {
                isSpeaking = false;
                if (btn) btn.classList.remove('playing');
            });
        }
        
        function showError(message) {
            const el = document.getElementById('errorMessage');
            el.textContent = message;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 5000);
        }
        
        window.addEventListener('load', function() {
            document.getElementById('statusIndicator').textContent = 'Este sitio implementa Inteligencia Artificial';
        });
    </script>
</body>
</html>
